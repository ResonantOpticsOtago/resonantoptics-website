name: Set up Hugo
description: Install the Hugo (extended) release pinned in .hugo-version and verify its checksum against Hugo's published checksums file.
runs:
  using: composite
  steps:
    - name: Install pinned Hugo
      shell: bash
      run: |
        v="$(tr -d '[:space:]' < .hugo-version)"
        base="https://github.com/gohugoio/hugo/releases/download/v${v}"
        tgz="hugo_extended_${v}_linux-amd64.tar.gz"
        curl -sSL -o "/tmp/$tgz" "$base/$tgz"
        curl -sSL -o /tmp/checksums.txt "$base/hugo_${v}_checksums.txt"
        (cd /tmp && grep " $tgz\$" checksums.txt | sha256sum -c -)
        sudo tar -xzf "/tmp/$tgz" -C /usr/local/bin hugo
        hugo version

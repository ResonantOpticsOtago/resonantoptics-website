# Hugo configuration (site-wide). Theme settings live in params.yaml.
# Hugo docs: https://gohugo.io/getting-started/configuration/

title: Resonant Optics
baseURL: 'https://resonantoptics.physics.otago.ac.nz/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## URLS - kept identical to the pre-2026 site so no published link breaks
############################

permalinks:
  # authors: the Kit links profiles as /authors/<id>/ (fixed in the theme); old /author/<id>/ URLs redirect via aliases
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'

taxonomies:
  author: authors
  tag: tags
  category: categories
  publication_type: publication_types

# The university server has no _redirects support, so Hugo writes HTML
# redirects for `aliases:` (old profile URLs).
disableAliases: false

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep

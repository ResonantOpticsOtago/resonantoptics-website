# HugoBlox Kit site parameters (schema 2.0).
# Reference: the Kit's templates, e.g. github.com/HugoBlox/kit/templates/academic-cv

hugoblox:
  schema: "2.0"
  identity:
    name: "Resonant Optics"
    organization: "University of Otago"
    type: organization
    tagline: "Resonant Optics research group, Department of Physics, University of Otago"
    description: "The Resonant Optics group at the University of Otago studies resonantly enhanced nonlinear optics with whispering-gallery-mode resonators: optical frequency combs, microwave-to-optical conversion and more."
  theme:
    mode: dark            # the previous site defaulted to dark; visitors can toggle
    pack: "default"
    colors:
      primary: "green"    # Tailwind palette name or hex
      secondary: ""
      neutral: ""
  typography:
    pack: "academic"
  layout:
    radius: "md"
    spacing: "spacious"
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
  footer:
    style: minimal
    language_switcher: false
    text: ""
  copyright:
    notice: "© {year} Resonant Optics, University of Otago. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: false
      share_alike: false
      allow_commercial: false
  seo:
    title: "Resonant Optics"
    location:
      address:
        street: "730 Cumberland Street"
        city: "Dunedin"
        region: "Otago"
        postal_code: "9016"
        country: "New Zealand"
      coordinates:
        latitude: -45.86385
        longitude: 170.51351
      phone: "+64 3 479 7754"
  content:
    math:
      enable: true
    toc:
      enable: false
    reading_time:
      enable: true
    citations:
      style: apa
  search:
    enable: true
  comments:
    enable: false
  analytics: {}
  # "Edit this page" links: switched on only in the preview build (config/preview/)
  repository:
    enable: false
    url: "https://github.com/ResonantOpticsOtago/resonantoptics-website"
    branch: draft
    content_dir: content
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us
  security:
    frame_options: sameorigin
  privacy:
    enable: false
  pro:
    hide_attribution: false

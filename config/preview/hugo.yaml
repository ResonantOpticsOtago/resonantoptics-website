############################
## PREVIEW ENVIRONMENT (Netlify builds of the draft branch)
## Loaded on top of config/_default/ when Hugo runs with
## HUGO_ENVIRONMENT=preview (set in netlify.toml). Nothing here reaches the
## published site, which is built with HUGO_ENVIRONMENT=production.
############################

# Show an "Edit this page" link on every news post; it opens the post's file
# in GitHub's web editor on the branch set in params.yaml (features.repository).
cascade:
  - target:
      path: /post/**
      kind: page
    editable: true

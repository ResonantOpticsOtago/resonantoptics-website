bio: "Florian Sedlmeir was a PhD Student at the Max Planck Institute for the Science of Light in Germany. Subsequently he spend time as a Research Assistant at the University of Otago and as a Postdoc at the Max Planck Institute for the Science of Light in the QIV group. He then spend some time in industry to return to Otago in 2022. \n\nFlorian received the prestigous Marie Skłodowska Curie Fellowship in 2024 as well as a Marsden Fast-Start. He will spend the out-going phase of the Marie Skłodowska Curie Fellowship at Otago."

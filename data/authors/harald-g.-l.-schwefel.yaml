bio: Harald Schwefel is a Professor in the Physics Department of the University of Otago and Principle Investigator in the [Te Whai Ao -- Dodd-Walls Centre for Photonic and Quantum Technologies](https://www.doddwalls.ac.nz) and the Quantum Technologies Aotearoa (QTA). His research interests are in the use of optical resonators. Such high quality resonators are great to generate very high field intensities. With high fields the interaction of light with matter can show significant nonlinearities and light can interact with itself and new colours can be created. A side effect of these high quality resonators is that they are extremely sensitive to changes in the environment making them an ideal candidate to measure such changes.

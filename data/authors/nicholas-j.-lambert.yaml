bio: Nick Lambert is a Research Fellow in the Physics Department of the University of Otago. His research has focused on the interaction of microwave photons with other things, including superconducting devices, semiconductor quantum dots, magnons, and optical frequency photons. Currently he interested in exploiting non-Hermitian physics for coherent control of magnonic hybrid systems, and using electro-optic whispering gallery mode resonators for quantum transduction and frequency combs.
